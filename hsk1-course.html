<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 HSK1 · Тетрадь</title>
<style>
  :root{
    --paper:#F6F1E7;
    --paper2:#EEE6D4;
    --ink:#262220;
    --ink-soft:#6E6459;
    --seal:#A6352C;
    --seal-soft:#C97B71;
    --jade:#3F6656;
    --gold:#B8863B;
    --line:#DBCFB6;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
    --serif: Georgia, "Noto Serif SC", "Songti SC", serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;}
  body{
    background-image:
      repeating-linear-gradient(transparent, transparent 27px, var(--line) 28px);
    background-attachment:local;
  }
  #shell{max-width:560px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.08);}
  header.top{padding:18px 18px 10px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5;}
  header.top h1{font-family:var(--serif);font-size:22px;margin:0 0 2px;font-weight:700;letter-spacing:.3px;}
  header.top .sub{font-size:12.5px;color:var(--ink-soft);}
  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:56px;z-index:5;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;border:1px solid var(--line);background:var(--paper2);color:var(--ink-soft);
    padding:7px 13px;border-radius:3px 3px 0 0;font-size:13px;font-family:var(--sans);cursor:pointer;
    border-bottom:3px solid transparent;
  }
  nav.tabs button.active{background:var(--paper);color:var(--seal);border-color:var(--line);border-bottom:3px solid var(--seal);font-weight:600;}
  main{flex:1;padding:16px 18px 40px;}
  h2.title{font-family:var(--serif);font-size:19px;margin:2px 0 12px;}
  h3.sub-title{font-family:var(--serif);font-size:16px;margin:18px 0 8px;color:var(--ink);}
  p{line-height:1.55;font-size:14.5px;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .card{background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .btn{
    display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    padding:9px 16px;border-radius:3px;font-size:13.5px;cursor:pointer;text-align:center;font-family:var(--sans);
  }
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.seal{background:var(--seal);border-color:var(--seal);}
  .btn.jade{background:var(--jade);border-color:var(--jade);}
  .btn:disabled{opacity:.4;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .stamp{
    width:30px;height:30px;min-width:30px;border:2px solid var(--seal);border-radius:5px;color:var(--seal);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;transform:rotate(-7deg);
    font-family:var(--serif);
  }
  .stamp.off{border-color:var(--line);color:var(--line);transform:none;}
  .progress-bar{height:7px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:6px;}
  .progress-bar > div{height:100%;background:var(--seal);}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);
    border-radius:6px;margin-bottom:8px;background:var(--paper2);cursor:pointer;
  }
  .list-item:active{background:var(--paper);}
  .list-item .name{font-weight:600;font-size:14.5px;}
  .list-item .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .cn{font-size:15px;}
  .cn-big{font-family:var(--serif);font-size:52px;text-align:center;margin:18px 0 6px;font-weight:700;}
  .py-big{text-align:center;color:var(--ink-soft);font-size:16px;margin-bottom:4px;}
  .ru-big{text-align:center;font-size:16px;margin-top:6px;}
  .flash{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:26px 16px;min-height:220px;display:flex;flex-direction:column;justify-content:center;}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .cat-grid .card{margin-bottom:0;cursor:pointer;}
  .opt{
    display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border:1px solid var(--line);
    border-radius:6px;background:var(--paper2);font-size:14.5px;cursor:pointer;font-family:var(--sans);color:var(--ink);
  }
  .opt.correct{border-color:var(--jade);background:#DCEAE3;}
  .opt.wrong{border-color:var(--seal);background:#F3DAD6;}
  .opt:disabled{cursor:default;}
  .chip{
    display:inline-block;padding:8px 12px;margin:4px;border:1px solid var(--line);border-radius:5px;
    background:var(--paper2);font-size:15px;cursor:pointer;
  }
  .chip.used{opacity:.35;}
  .answer-box{min-height:52px;border:1px dashed var(--line);border-radius:6px;padding:8px;margin:10px 0;background:var(--paper);}
  .feedback{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:13.5px;}
  .feedback.ok{background:#DCEAE3;color:var(--jade);border:1px solid var(--jade);}
  .feedback.bad{background:#F3DAD6;color:var(--seal);border:1px solid var(--seal);}
  .speak-btn{border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;}
  .dot0{background:var(--line);} .dot1{background:var(--gold);} .dot2{background:var(--jade);}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:9px 16px;border-radius:5px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:80%;text-align:center;}
  #toast.show{opacity:1;}
  .backlink{color:var(--ink-soft);font-size:13px;cursor:pointer;margin-bottom:10px;display:inline-block;}
  .segmented{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px;}
  .segmented button{flex:1;padding:9px;border:none;background:var(--paper2);color:var(--ink-soft);font-size:13px;cursor:pointer;font-family:var(--sans);}
  .segmented button.active{background:var(--ink);color:var(--paper);}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);}
</style>
</head>
<body>
<div id="shell">
  <header class="top">
    <h1>我的 HSK1 <span style="color:var(--seal)">笔记</span></h1>
    <div class="sub" id="headerSub">Личная тетрадь подготовки к экзамену</div>

  <main id="main"></main>
</div>
<div id="toast"></div>

/* ============ STORAGE ============ */
const DEFAULT_PROGRESS = ()=>({vocab:{}, grammar:[], reading:{}, tests:[], listenBest:0, writeBest:0});
let progress = DEFAULT_PROGRESS();
let storageOK = true;

async function loadProgress(){
  try{
    const r = await window.storage.get('hsk1-progress', false);
    if(r && r.value) progress = Object.assign(DEFAULT_PROGRESS(), JSON.parse(r.value));
  }catch(e){ /* first run or storage unavailable */ }
}
async function saveProgress(){
  try{ await window.storage.set('hsk1-progress', JSON.stringify(progress), false); }
  catch(e){ storageOK=false; }
}

/* ============ UTIL ============ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function pickN(arr,n){ return shuffle(arr).slice(0,n); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._toastT); window._toastT=setTimeout(()=>t.classList.remove('show'),1800); }
function speak(text){
  try{
    if(!('speechSynthesis' in window)){ toast('Озвучка не поддерживается этим браузером'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[。，？！]/g,''));
    u.lang='zh-CN'; u.rate=0.82;
    const voices = speechSynthesis.getVoices();
    const v = voices.find(v=>v.lang && v.lang.toLowerCase().indexOf('zh')===0);
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){ toast('Не удалось воспроизвести звук'); }
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============ APP STATE / NAV ============ */
const TABS = [
 {id:'dash', label:'Обзор'},
 {id:'vocab', label:'Слова'},
 {id:'grammar', label:'Грамматика'},
 {id:'reading', label:'Чтение'},
 {id:'listen', label:'Аудирование'},
 {id:'write', label:'Письмо'},
 {id:'test', label:'Тест'}
];
let currentTab='dash';

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" class="${t.id===currentTab?'active':''}">${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=> go(b.dataset.tab)) );
}
function go(tab){
  currentTab = tab;
  renderTabs();
  const main = document.getElementById('main');
  main.scrollTop = 0; window.scrollTo(0,0);
  if(tab==='dash') renderDash(main);
  else if(tab==='vocab') renderVocabHome(main);
  else if(tab==='grammar') renderGrammarHome(main);
  else if(tab==='reading') renderReadingHome(main);
  else if(tab==='listen') renderListenHome(main);
  else if(tab==='write') renderWriteHome(main);
  else if(tab==='test') renderTestHome(main);
}

/* ============ DASHBOARD ============ */
function vocabStats(){
  let known=0, learning=0;
  VOCAB.forEach(w=>{ const lv=progress.vocab[w.id]||0; if(lv===2) known++; else if(lv===1) learning++; });
  return {known, learning, total:VOCAB.length};
}
function renderDash(main){
  const vs = vocabStats();
  const gDone = progress.grammar.length, gTotal = GRAMMAR.length;
  const rDone = Object.keys(progress.reading).filter(k=>progress.reading[k].done).length, rTotal = READING.length;
  const lastTest = progress.tests.length ? progress.tests[progress.tests.length-1] : null;
  const overallPct = Math.round(((vs.known/vs.total)*0.4 + (gDone/gTotal)*0.3 + (rDone/rTotal)*0.3)*100);

  main.innerHTML = `
    <h2 class="title">Твой прогресс</h2>
    <div class="card">
      <div class="row"><strong>Общий прогресс HSK1</strong><span class="pill">${overallPct}%</span></div>
      <div class="progress-bar"><div style="width:${overallPct}%"></div></div>
      <p class="muted" style="margin-top:10px">Курс основан на классическом списке HSK 1 (150 слов, Hanban 2010) + немного бонусной лексики. Он по-прежнему принимается наряду с новым HSK 3.0 во многих центрах — если сдаёшь по новой версии, список слов там немного шире.</p>
    </div>

    <div class="card" data-go="vocab">
      <div class="row"><strong>📖 Слова</strong><span class="pill">${vs.known}/${vs.total}</span></div>
      <div class="progress-bar"><div style="width:${Math.round(vs.known/vs.total*100)}%"></div></div>
      <p class="muted">Выучено — ${vs.known}, учится — ${vs.learning}, ещё не открыто — ${vs.total-vs.known-vs.learning}</p>
    </div>
    <div class="card" data-go="grammar">
      <div class="row"><strong>🧩 Грамматика</strong><span class="pill">${gDone}/${gTotal}</span></div>
      <div class="progress-bar"><div style="width:${Math.round(gDone/gTotal*100)}%"></div></div>
    </div>
    <div class="card" data-go="reading">
      <div class="row"><strong>📰 Чтение</strong><span class="pill">${rDone}/${rTotal}</span></div>
      <div class="progress-bar"><div style="width:${Math.round(rDone/rTotal*100)}%"></div></div>
    </div>
    <div class="card" data-go="listen">
      <div class="row"><strong>🎧 Аудирование</strong><span class="pill">рекорд ${progress.listenBest}%</span></div>
    </div>
    <div class="card" data-go="write">
      <div class="row"><strong>✍️ Письмо</strong><span class="pill">рекорд ${progress.writeBest}%</span></div>
    </div>
    <div class="card" data-go="test">
      <div class="row"><strong>🧾 Комплексный тест</strong><span class="pill">${lastTest? lastTest.score+'/'+lastTest.total : 'ещё не пройден'}</span></div>
      <p class="muted">Смешанный тест по всем разделам — как настоящий формат экзамена.</p>
    </div>
    <button class="btn ghost" id="resetBtn" style="margin-top:8px">Сбросить прогресс</button>
  `;
  main.querySelectorAll('[data-go]').forEach(el=> el.style.cursor='pointer');
  main.querySelectorAll('[data-go]').forEach(el=> el.addEventListener('click', ()=> go(el.dataset.go)));
  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    if(confirm('Точно сбросить весь прогресс? Это нельзя отменить.')){
      progress = DEFAULT_PROGRESS();
      await saveProgress();
      renderDash(main);
      toast('Прогресс сброшен');
    }
  });
}

/* ============ VOCAB ============ */
function renderVocabHome(main){
  const rows = Object.keys(CATS).map(c=>{
    const words = VOCAB.filter(w=>w.c===c);
    const known = words.filter(w=>(progress.vocab[w.id]||0)===2).length;
    return `<div class="card" style="cursor:pointer" data-cat="${c}">
      <div class="row"><strong>${CATS[c]}</strong><span class="pill">${known}/${words.length}</span></div>
      <div class="progress-bar"><div style="width:${Math.round(known/words.length*100)}%"></div></div>
    </div>`;
  }).join('');
  main.innerHTML = `<h2 class="title">Словарь HSK1</h2>
    <p class="muted">Выбери тему, чтобы учить карточками, или посмотри общий список.</p>
    <div class="btn-row"><button class="btn seal" id="allCards">🗂 Карточки: все слова</button><button class="btn ghost" id="allList">📋 Список всех слов</button></div>
    <h3 class="sub-title">По темам</h3>
    ${rows}`;
  main.querySelectorAll('[data-cat]').forEach(el=> el.addEventListener('click', ()=> renderVocabList(main, el.dataset.cat)) );
  document.getElementById('allCards').addEventListener('click', ()=> startFlashcards(main, VOCAB));
  document.getElementById('allList').addEventListener('click', ()=> renderVocabList(main, 'all'));
}
function renderVocabList(main, cat){

  main.innerHTML = `<span class="backlink" id="back">← Все темы</span>

function startFlashcards(main, words){
  const queue = shuffle(words);
  let idx=0, flipped=false;
  function render(){
    if(idx>=queue.length){
      main.innerHTML = `<h2 class="title">Готово! 🎉</h2><p>Карточки этой подборки пройдены.</p>
        <div class="btn-row"><button class="btn seal" id="again">Ещё раз</button><button class="btn ghost" id="back2">← К темам</button></div>`;
      document.getElementById('again').addEventListener('click', ()=> startFlashcards(main, words));
      document.getElementById('back2').addEventListener('click', ()=> renderVocabHome(main));
      return;
    }
    const w = queue[idx];
    flipped=false;
    main.innerHTML = `<span class="backlink" id="back">← Выйти</span>
      <p class="muted">Карточка ${idx+1} из ${queue.length}</p>
      <div class="flash" id="flashCard">
        <div class="cn-big">${w.h}</div>
        <div id="revealArea" style="text-align:center;min-height:40px;"></div>
      </div>
      <div class="btn-row" style="justify-content:center">
        <button class="speak-btn" id="sp" style="width:44px;height:44px;font-size:18px">🔊</button>
      </div>
      <div id="rateRow" class="btn-row" style="display:none;margin-top:16px">
        <button class="btn ghost" id="r0">Не знаю</button>
        <button class="btn" id="r1">Учу</button>
        <button class="btn jade" id="r2">Знаю</button>
      </div>
      <p class="muted" style="text-align:center;margin-top:10px" id="tapHint">Нажми на карточку, чтобы увидеть пиньинь и перевод</p>
    `;
    document.getElementById('back').addEventListener('click', ()=> renderVocabHome(main));
    document.getElementById('sp').addEventListener('click', ()=> speak(w.h));
    document.getElementById('flashCard').addEventListener('click', ()=>{
      if(flipped) return;
      flipped=true;
      document.getElementById('revealArea').innerHTML = `<div class="py-big">${w.p}</div><div class="ru-big">${w.r}</div>`;
      document.getElementById('rateRow').style.display='flex';
      document.getElementById('tapHint').style.display='none';
    });
    ['r0','r1','r2'].forEach((id,lv)=>{
      document.getElementById(id).addEventListener('click', async ()=>{
        progress.vocab[w.id]=lv; await saveProgress();
        idx++; render();
      });
    });
  }
  render();
}

function renderGrammarLesson(main, id){

}
function runGrammarQuiz(main, g){
  let idx=0, correct=0;
  function render(){
    if(idx>=g.quiz.length){
      const pass = correct===g.quiz.length;
      main.innerHTML = `<h2 class="title">${pass?'Отлично! 🌟':'Почти получилось'}</h2>
        <p>Правильных ответов: ${correct} из ${g.quiz.length}</p>
        <div class="btn-row"><button class="btn ghost" id="retry">Повторить</button><button class="btn seal" id="done">К списку тем</button></div>`;
      document.getElementById('retry').addEventListener('click', ()=> runGrammarQuiz(main, g));
      document.getElementById('done').addEventListener('click', async ()=>{
        if(pass && !progress.grammar.includes(g.id)){ progress.grammar.push(g.id); await saveProgress(); }
        renderGrammarHome(main);
      });
      return;
    }
    const item = g.quiz[idx];
    const opts = shuffle(item.o);
    main.innerHTML = `<p class="muted">Вопрос ${idx+1} из ${g.quiz.length}</p>
      <div class="card"><p style="font-size:16px">${item.q}</p></div>
      <div id="opts"></div><div id="fb"></div>`;
    const optsEl = document.getElementById('opts');
    optsEl.innerHTML = opts.map(o=>`<button class="opt" data-o="${esc(o)}">${o}</button>`).join('');
    optsEl.querySelectorAll('.opt').forEach(b=> b.addEventListener('click', ()=>{
      optsEl.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      const ok = b.dataset.o===item.a;
      b.classList.add(ok?'correct':'wrong');
      if(!ok) optsEl.querySelectorAll('.opt').forEach(x=>{ if(x.dataset.o===item.a) x.classList.add('correct'); });
      if(ok) correct++;
      document.getElementById('fb').innerHTML = `<div class="feedback ${ok?'ok':'bad'}">${ok?'Верно!':'Правильный ответ: '+item.a}</div>
        <div class="btn-row"><button class="btn seal" id="next">Дальше →</button></div>`;
      document.getElementById('next').addEventListener('click', ()=>{ idx++; render(); });
    }));
  }
  render();
}

/* ============ LISTENING ============ */
function renderListenHome(main){
  main.innerHTML = `<h2 class="title">Аудирование</h2>
    <p class="muted">Слушай и выбирай правильный перевод. Нажимай на 🔊, чтобы услышать снова.</p>
    <div class="card"><strong>Рекорд:</strong> ${progress.listenBest}%</div>
    <div class="btn-row"><button class="btn seal" id="wmode">🔤 Слова (10 раундов)</button><button class="btn seal" id="smode">💬 Предложения (10 раундов)</button></div>
    <p class="muted" style="margin-top:14px">Если звук не воспроизводится — проверь, что в браузере включён голос для китайского (zh-CN). На некоторых устройствах его нужно один раз установить в системных настройках.</p>`;
  document.getElementById('wmode').addEventListener('click', ()=> runListen(main, 'word'));
  document.getElementById('smode').addEventListener('click', ()=> runListen(main, 'sentence'));
}
function runListen(main, mode){
  const pool = mode==='word' ? pickN(VOCAB, Math.min(10, VOCAB.length)) : pickN(SENTENCES, Math.min(10, SENTENCES.length));
  let idx=0, correct=0;
  function render(){
    if(idx>=pool.length){
      const pct = Math.round(correct/pool.length*100);
      main.innerHTML = `<h2 class="title">Раунд завершён 🎧</h2><p>Правильно: ${correct} из ${pool.length} (${pct}%)</p>
        <div class="btn-row"><button class="btn ghost" id="retry">Ещё раз</button><button class="btn seal" id="done">← К аудированию</button></div>`;
      document.getElementById('retry').addEventListener('click', ()=> runListen(main, mode));
      document.getElementById('done').addEventListener('click', async ()=>{
        if(pct>progress.listenBest){ progress.listenBest=pct; await saveProgress(); }
        renderListenHome(main);
      });
      return;
    }
    const item = pool[idx];
    const text = mode==='word' ? item.h : item.cn;
    const correctAns = mode==='word' ? item.r : item.ru;
    const distractorsFrom = mode==='word' ? VOCAB.filter(w=>w!==item).map(w=>w.r) : SENTENCES.filter(s=>s!==item).map(s=>s.ru);
    const opts = shuffle([correctAns, ...pickN(distractorsFrom,3)]);
    main.innerHTML = `<p class="muted">Раунд ${idx+1} из ${pool.length}</p>
      <div class="flash" style="min-height:120px"><button class="speak-btn" id="playBtn" style="width:60px;height:60px;font-size:24px;margin:0 auto">🔊</button>
      <p class="muted" style="text-align:center;margin-top:10px">Нажми, чтобы прослушать</p></div>
      <div id="opts" style="margin-top:14px"></div><div id="fb"></div>`;
    document.getElementById('playBtn').addEventListener('click', ()=> speak(text));
    speak(text);
    const optsEl = document.getElementById('opts');
    optsEl.innerHTML = opts.map(o=>`<button class="opt" data-o="${esc(o)}">${o}</button>`).join('');
    optsEl.querySelectorAll('.opt').forEach(b=> b.addEventListener('click', ()=>{
      optsEl.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      const ok = b.dataset.o===correctAns;
      b.classList.add(ok?'correct':'wrong');
      if(!ok) optsEl.querySelectorAll('.opt').forEach(x=>{ if(x.dataset.o===correctAns) x.classList.add('correct'); });
      if(ok) correct++;
      document.getElementById('fb').innerHTML = `<div class="feedback ${ok?'ok':'bad'}">${ok?'Верно!':'Правильный ответ: '+correctAns}</div>
        <div class="row" style="margin-top:6px"><span class="muted cn">${text}</span></div>
        <div class="btn-row"><button class="btn seal" id="next">Дальше →</button></div>`;
      document.getElementById('next').addEventListener('click', ()=>{ idx++; render(); });
    }));
  }
  render();
}

/* ============ WRITING (word order) ============ */
function renderWriteHome(main){
  main.innerHTML = `<h2 class="title">Письмо</h2>
    <p class="muted">Собери китайское предложение из слов в правильном порядке по русскому переводу.</p>
    <div class="card"><strong>Рекорд:</strong> ${progress.writeBest}%</div>
    <div class="btn-row"><button class="btn seal" id="start">Начать (10 предложений) →</button></div>`;
  document.getElementById('start').addEventListener('click', ()=> runWrite(main));
}
function runWrite(main){
  const pool = pickN(SENTENCES, Math.min(10, SENTENCES.length));
  let idx=0, correct=0;
  function render(){
    if(idx>=pool.length){
      const pct = Math.round(correct/pool.length*100);
      main.innerHTML = `<h2 class="title">Готово ✍️</h2><p>Правильно: ${correct} из ${pool.length} (${pct}%)</p>
        <div class="btn-row"><button class="btn ghost" id="retry">Ещё раз</button><button class="btn seal" id="done">← К письму</button></div>`;
      document.getElementById('retry').addEventListener('click', ()=> runWrite(main));
      document.getElementById('done').addEventListener('click', async ()=>{
        if(pct>progress.writeBest){ progress.writeBest=pct; await saveProgress(); }
        renderWriteHome(main);
      });
      return;
    }
    const item = pool[idx];
    let built = [];
    let chips = shuffle(item.t.map((w,i)=>({w,i})));
    function draw(){
      main.innerHTML = `<p class="muted">Предложение ${idx+1} из ${pool.length}</p>
        <div class="card"><strong>${item.ru}</strong></div>
        <div class="answer-box" id="ansBox"></div>
        <div id="chipBox"></div>
        <div class="btn-row"><button class="btn ghost" id="undo">Назад</button><button class="btn seal" id="check" ${built.length===item.t.length?'':'disabled'}>Проверить</button></div>
        <div id="fb"></div>`;
      document.getElementById('ansBox').innerHTML = built.map(b=>`<span class="chip">${b.w}</span>`).join('') || '<span class="muted">Собери предложение снизу</span>';
      document.getElementById('chipBox').innerHTML = chips.map(c=>`<span class="chip ${built.find(b=>b.i===c.i)?'used':''}" data-i="${c.i}">${c.w}</span>`).join('');
      document.getElementById('chipBox').querySelectorAll('.chip').forEach(el=> el.addEventListener('click', ()=>{
        const i = parseInt(el.dataset.i);
        if(built.find(b=>b.i===i)) return;
        built.push({w:item.t[i], i});
        draw();
      }));
      document.getElementById('undo').addEventListener('click', ()=>{ built.pop(); draw(); });
      const checkBtn = document.getElementById('check');
      if(!checkBtn.disabled){
        checkBtn.addEventListener('click', ()=>{
          const ans = built.map(b=>b.w).join('');
          const ok = ans === item.t.join('');
          if(ok) correct++;
          document.getElementById('fb').innerHTML = `<div class="feedback ${ok?'ok':'bad'}">${ok?'Верно! 完':'Правильный порядок: '+item.t.join('')}</div>
            <div class="btn-row"><button class="btn seal" id="next">Дальше →</button></div>`;
          document.getElementById('chipBox').querySelectorAll('.chip').forEach(c=>c.style.pointerEvents='none');
          document.getElementById('undo').disabled=true; checkBtn.disabled=true;
          document.getElementById('next').addEventListener('click', ()=>{ idx++; render(); });
        });
      }
    }
    draw();
  }
  render();
}

/* ============ FINAL TEST ============ */
function buildTestQuestions(){
  const qs = [];
  pickN(VOCAB,6).forEach(w=>{
    const distractors = pickN(VOCAB.filter(x=>x!==w).map(x=>x.r),3);
    qs.push({type:'vocab', prompt:`Что означает «${w.h}» (${w.p})?`, o:shuffle([w.r,...distractors]), a:w.r});
  });
  const gPool=[]; GRAMMAR.forEach(g=>g.quiz.forEach(qq=>gPool.push(qq)));
  pickN(gPool,6).forEach(qq=> qs.push({type:'grammar', prompt:qq.q, o:shuffle(qq.o), a:qq.a}));
  const rPool=[]; READING.forEach(r=>r.q.forEach(qq=>rPool.push({...qq, ctx:r.text.join(''), title:r.title})));
  pickN(rPool,4).forEach(qq=> qs.push({type:'reading', prompt:`«${qq.title}»: ${qq.q}`, extra:qq.ctx, o:shuffle(qq.o), a:qq.a}));
  pickN(SENTENCES,4).forEach(s=>{
    const wrong1 = shuffle(s.t).join('');
    const wrong2 = shuffle(s.t).join('');
    const opts = Array.from(new Set([s.cn, wrong1, wrong2])).slice(0,3);
    while(opts.length<4){ const w = shuffle(s.t).join(''); if(!opts.includes(w)) opts.push(w); }
    qs.push({type:'write', prompt:`Собери фразу: «${s.ru}»`, o:shuffle(opts), a:s.cn});
  });
  return shuffle(qs);
}
function renderTestHome(main){
  const lastTest = progress.tests.length ? progress.tests[progress.tests.length-1] : null;
  main.innerHTML = `<h2 class="title">Комплексный тест</h2>
    <p class="muted">20 вопросов вперемешку: слова, грамматика, чтение и построение фраз — как на настоящем экзамене.</p>
    ${lastTest?`<div class="card"><strong>Последний результат:</strong> ${lastTest.score}/${lastTest.total} · ${lastTest.date}</div>`:''}
    ${progress.tests.length>1?`<div class="card"><strong>История:</strong><br>${progress.tests.slice(-5).map(t=>`${t.date}: ${t.score}/${t.total}`).join('<br>')}</div>`:''}
    <div class="btn-row"><button class="btn seal" id="start">Начать тест →</button></div>`;
  document.getElementById('start').addEventListener('click', ()=> runTest(main));
}
function runTest(main){
  const qs = buildTestQuestions();
  let idx=0, correct=0;
  function render(){
    if(idx>=qs.length){
      const date = new Date().toLocaleDateString('ru-RU');
      main.innerHTML = `<h2 class="title">Тест завершён</h2>
        <div class="card"><div class="row"><strong>Результат</strong><span class="pill">${correct}/${qs.length}</span></div>
        <div class="progress-bar"><div style="width:${Math.round(correct/qs.length*100)}%"></div></div></div>
        <p>${correct/qs.length>=0.8?'Отличный результат — ты хорошо готов(а) к этой теме! 🎉':'Есть над чем поработать — загляни в разделы, где были ошибки.'}</p>
        <div class="btn-row"><button class="btn ghost" id="retry">Пройти ещё раз</button><button class="btn seal" id="done">К обзору</button></div>`;
      document.getElementById('retry').addEventListener('click', ()=> runTest(main));
      document.getElementById('done').addEventListener('click', async ()=>{
        progress.tests.push({date, score:correct, total:qs.length});
        await saveProgress();
        go('dash');
      });
      return;
    }
    const item = qs[idx];
    main.innerHTML = `<p class="muted">Вопрос ${idx+1} из ${qs.length}</p>
      <div class="card"><p style="font-size:15.5px">${item.prompt}</p>${item.extra?`<p class="muted cn">${item.extra}</p>`:''}</div>
      <div id="opts"></div><div id="fb"></div>`;
    const optsEl = document.getElementById('opts');
    optsEl.innerHTML = item.o.map(o=>`<button class="opt ${item.type!=='vocab'&&item.type!=='grammar'?'cn':''}" data-o="${esc(o)}">${o}</button>`).join('');
    optsEl.querySelectorAll('.opt').forEach(b=> b.addEventListener('click', ()=>{
      optsEl.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      const ok = b.dataset.o===item.a;
      b.classList.add(ok?'correct':'wrong');
      if(!ok) optsEl.querySelectorAll('.opt').forEach(x=>{ if(x.dataset.o===item.a) x.classList.add('correct'); });
      if(ok) correct++;
      document.getElementById('fb').innerHTML = `<div class="feedback ${ok?'ok':'bad'}">${ok?'Верно!':'Правильный ответ: '+item.a}</div>
        <div class="btn-row"><button class="btn seal" id="next">Дальше →</button></div>`;
      document.getElementById('next').addEventListener('click', ()=>{ idx++; render(); });
    }));
  }
  render();
}

(async function init(){
  await loadProgress();
  renderTabs();
  go('dash');
  if('speechSynthesis' in window){ speechSynthesis.getVoices(); }
})();
